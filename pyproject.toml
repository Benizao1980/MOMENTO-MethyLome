[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="momento-methylome"
version="0.1.0.dev0"
description="Species-agnostic comparative bacterial methylomics"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
dependencies=["numpy>=1.24","pandas>=2.0","scipy>=1.10","scikit-learn>=1.3","matplotlib>=3.7"]

[project.optional-dependencies]
dev=["pytest>=7.4","ruff>=0.5"]

[project.scripts]
momento="momento.cli:main"

[tool.setuptools.packages.find]
where=["src"]
